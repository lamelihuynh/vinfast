<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky progress bar + milestone sections of task cards; status per task is shared via db */
:root{
  --bg:#f6f8fa; --surface:#ffffff; --fg:#17202a; --muted:#5a6773; --line:#dde3e9;
  --accent:#1f5fbf; --accent-soft:#e7effb;
  --pg:#2f5d8a; --pg-soft:#e4edf6; --mg:#1d7a46; --mg-soft:#e2f3e9;
  --warn:#9a5b00; --warn-soft:#fdf1dc; --ok:#1d7a46; --ok-soft:#e2f3e9; --doing:#8a5a00; --doing-soft:#fdf1dc;
  --code-bg:#eef2f6;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1418; --surface:#161d23; --fg:#e3e9ee; --muted:#93a1ad; --line:#26313a;
  --accent:#7fb0ff; --accent-soft:#1a2a40; --pg:#8fb8e3; --pg-soft:#1a2836; --mg:#6fd39a; --mg-soft:#15291e;
  --warn:#f0b65a; --warn-soft:#2e2412; --ok:#6fd39a; --ok-soft:#15291e; --doing:#f0b65a; --doing-soft:#2e2412; --code-bg:#1c252d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1418; --surface:#161d23; --fg:#e3e9ee; --muted:#93a1ad; --line:#26313a;
  --accent:#7fb0ff; --accent-soft:#1a2a40; --pg:#8fb8e3; --pg-soft:#1a2836; --mg:#6fd39a; --mg-soft:#15291e;
  --warn:#f0b65a; --warn-soft:#2e2412; --ok:#6fd39a; --ok-soft:#15291e; --doing:#f0b65a; --doing-soft:#2e2412; --code-bg:#1c252d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header.top{padding-block:36px 18px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:28px;line-height:1.2;margin:6px 0 10px;text-wrap:balance}
h2{font-size:21px;margin:0 0 12px;text-wrap:balance}
h3{font-size:16px;margin:0}
h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 6px}
p{margin:0 0 10px;max-width:72ch}
.lede{color:var(--muted);max-width:68ch}
a{color:var(--accent)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px))}
.bar-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.meter{flex:1 1 220px;height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex;min-width:0}
.meter .m-done{background:var(--ok)} .meter .m-doing{background:var(--doing)}
.counts{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.counts b{color:var(--fg)}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filters button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:3px 10px;border-radius:99px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sync{font-size:12px;color:var(--muted)}
nav.toc{display:flex;gap:4px;overflow-x:auto;margin-top:8px;scrollbar-width:thin}
nav.toc a{flex:none;font-size:12.5px;color:var(--muted);text-decoration:none;padding:3px 8px;border-radius:6px;white-space:nowrap}
nav.toc a:hover,nav.toc a:focus-visible{background:var(--accent-soft);color:var(--accent);outline:none}
section{padding-top:36px;scroll-margin-top:110px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid>*{min-width:0}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 7px;border-radius:4px;vertical-align:middle}
.tag.pg{background:var(--pg-soft);color:var(--pg)} .tag.mg{background:var(--mg-soft);color:var(--mg)}
.tag.ddl{background:var(--warn-soft);color:var(--warn)} .tag.new{background:var(--accent-soft);color:var(--accent)}
code{font-family:var(--f-mono);font-size:.86em;background:var(--code-bg);padding:1px 5px;border-radius:4px;word-break:break-word}
pre{background:var(--code-bg);border-radius:8px;padding:12px 14px;overflow-x:auto;font-size:12.5px;line-height:1.5;margin:8px 0 12px}
pre code{background:none;padding:0;font-size:inherit;word-break:normal}
ul,ol{margin:0 0 10px;padding-left:22px} li{margin:3px 0}
.tbl{overflow-x:auto;margin:8px 0 14px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--surface)}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:none}
.callout{border-left:3px solid var(--warn);background:var(--warn-soft);padding:12px 14px;border-radius:0 8px 8px 0;margin:12px 0}
.callout.info{border-color:var(--accent);background:var(--accent-soft)}
.milestone>h2 .wk{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-weight:400;margin-right:6px}
.tasks{display:grid;gap:10px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.task[data-status="done"]{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.task[data-status="doing"]{border-color:color-mix(in srgb,var(--doing) 45%,var(--line))}
.task-head{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 16px;cursor:pointer}
.task-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tid{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.task-head h3{min-width:0}
.task-head .meta{grid-column:2/3;font-size:12.5px;color:var(--muted)}
.status-slot{grid-row:1/3;grid-column:3}
.status-slot select{font:inherit;font-size:12.5px;padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.task[data-status="done"] .status-slot select{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.task[data-status="doing"] .status-slot select{background:var(--doing-soft);color:var(--doing);border-color:var(--doing)}
.who{display:block;font-size:11px;color:var(--muted);text-align:right;margin-top:2px}
.task-body{padding:0 16px 14px;border-top:1px solid var(--line)}
.task:not(.open) .task-body{display:none}
.task-body>p:first-child{margin-top:12px}
.files li code{font-weight:600}
.dod{list-style:none;padding-left:0}
.dod li::before{content:"✓ ";color:var(--ok);font-weight:700}
@media (max-width:560px){.task-head{grid-template-columns:1fr auto}.tid{grid-column:1/2}.task-head h3{grid-column:1/3;grid-row:2}.task-head .meta{grid-column:1/3;grid-row:3}.status-slot{grid-row:1;grid-column:2}}
footer{margin-top:48px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

<div class="wrap">
<header class="top">
  <div class="eyebrow">{{EYEBROW}}</div>
  <h1>{{H1}}</h1>
  <p class="lede">{{LEDE}}</p>
</header>

<div class="bar" role="region" aria-label="Tiến độ">
  <div class="bar-row">
    <div class="meter" aria-hidden="true"><div class="m-done" id="m-done" style="width:0"></div><div class="m-doing" id="m-doing" style="width:0"></div></div>
    <span class="counts" id="counts">0 task</span>
    <div class="filters" role="group" aria-label="Lọc theo trạng thái">
      <button type="button" data-filter="all" aria-pressed="true">Tất cả</button>
      <button type="button" data-filter="todo" aria-pressed="false">Chưa làm</button>
      <button type="button" data-filter="doing" aria-pressed="false">Đang làm</button>
      <button type="button" data-filter="done" aria-pressed="false">Xong</button>
    </div>
    <span class="sync" id="sync">Đang kết nối…</span>
  </div>
  <nav class="toc" aria-label="Mục lục">{{TOC}}</nav>
</div>

{{CONTENT}}

<footer>{{FOOTER}}</footer>
</div>

<script>
(function(){
  var TOPIC = '{{TOPIC_ID}}';
  var LABELS = {todo:'Chưa làm', doing:'Đang làm', done:'Xong'};
  var tasks = Array.prototype.slice.call(document.querySelectorAll('.task[data-task]'));
  var state = {}; // id -> {status, by, at}
  var db = null, user = null, myId = null, canWrite = true, names = {};
  var LKEY = 'vinfast-tasks-' + TOPIC;
  try { state = JSON.parse(localStorage.getItem(LKEY) || '{}') || {}; } catch(e) { state = {}; }
  var syncEl = document.getElementById('sync');
  function setSync(t){ syncEl.textContent = t; }

  tasks.forEach(function(t){
    var id = t.getAttribute('data-task');
    var slot = t.querySelector('.status-slot');
    var sel = document.createElement('select');
    sel.id = 'st-' + id;
    sel.setAttribute('aria-label', 'Trạng thái ' + id);
    ['todo','doing','done'].forEach(function(k){ var o = document.createElement('option'); o.value = k; o.textContent = LABELS[k]; sel.appendChild(o); });
    var who = document.createElement('span'); who.className = 'who';
    slot.appendChild(sel); slot.appendChild(who);
    sel.addEventListener('click', function(e){ e.stopPropagation(); });
    sel.addEventListener('change', function(){ save(id, sel.value); });
    var head = t.querySelector('.task-head');
    head.setAttribute('tabindex','0');
    head.setAttribute('role','button');
    head.addEventListener('click', function(){ t.classList.toggle('open'); head.setAttribute('aria-expanded', t.classList.contains('open')); });
    head.addEventListener('keydown', function(e){ if ((e.key === 'Enter' || e.key === ' ') && e.target === head) { e.preventDefault(); head.click(); } });
    head.setAttribute('aria-expanded','false');
  });

  function render(){
    var c = {todo:0, doing:0, done:0};
    tasks.forEach(function(t){
      var id = t.getAttribute('data-task');
      var s = (state[id] && state[id].status) || 'todo';
      c[s]++;
      t.setAttribute('data-status', s);
      var sel = document.getElementById('st-' + id);
      if (sel.value !== s) sel.value = s;
      sel.disabled = !canWrite;
      var who = t.querySelector('.who');
      var st = state[id];
      if (st && st.by && st.status !== 'todo') {
        var n = names[st.by] || '';
        var d = st.at ? new Date(st.at) : null;
        who.textContent = (n ? n : 'Ai đó') + (d ? ' · ' + d.toLocaleDateString('vi-VN') : '');
      } else who.textContent = '';
    });
    var total = tasks.length || 1;
    document.getElementById('m-done').style.width = (c.done/total*100) + '%';
    document.getElementById('m-doing').style.width = (c.doing/total*100) + '%';
    document.getElementById('counts').innerHTML = '<b>' + c.done + '</b>/' + tasks.length + ' xong · ' + c.doing + ' đang làm';
    applyFilter();
  }

  var filter = 'all';
  document.querySelectorAll('.filters button').forEach(function(b){
    b.addEventListener('click', function(){
      filter = b.getAttribute('data-filter');
      document.querySelectorAll('.filters button').forEach(function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      applyFilter();
    });
  });
  function applyFilter(){
    tasks.forEach(function(t){ t.hidden = !(filter === 'all' || t.getAttribute('data-status') === filter); });
  }

  function persistLocal(){ try { localStorage.setItem(LKEY, JSON.stringify(state)); } catch(e) {} }

  var writing = {};
  function save(id, status){
    state[id] = {status: status, by: myId || null, at: new Date().toISOString()};
    render();
    if (!db) { persistLocal(); return; }
    if (writing[id]) { writing[id].next = status; return; }
    writing[id] = {};
    (function go(s){
      db.collection('tasks').doc(id).set({status: s, by: myId || null, at: new Date().toISOString(), topic: TOPIC})
        .catch(function(e){
          if (e && e.code === 'invalid_argument') { canWrite = false; setSync('Chỉ xem: bạn chưa có quyền cập nhật'); render(); }
          else setSync('Chưa lưu được, thử lại sau');
        })
        .then(function(){
          var n = writing[id] && writing[id].next;
          if (n && n !== s) { writing[id].next = null; go(n); } else delete writing[id];
        });
    })(status);
  }

  function resolveNames(){
    if (!user || !user.profiles) return;
    var ids = [];
    Object.keys(state).forEach(function(k){ var b = state[k] && state[k].by; if (b && ids.indexOf(b) < 0) ids.push(b); });
    if (!ids.length) return;
    user.profiles(ids).then(function(ps){ ids.forEach(function(i){ names[i] = (ps && ps[i] && ps[i].name) || ''; }); render(); }).catch(function(){});
  }

  render();
  if (!window.claude || !window.claude.use) { setSync('Lưu trên trình duyệt này'); return; }
  Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function(r){
    db = r[0]; user = r[1];
    if (!db) { setSync('Lưu trên trình duyệt này'); return; }
    var p = (user && user.id) ? user.id() : Promise.resolve(null);
    p.then(function(id){ myId = id; }).catch(function(){});
    if (user && user.can) { Promise.resolve(user.can('data.write')).then(function(v){ if (v === false) { canWrite = false; setSync('Chỉ xem'); render(); } }).catch(function(){}); }
    var timer = setTimeout(function(){ setSync('Chưa kết nối được dữ liệu chung'); }, 10000);
    db.collection('tasks').where('topic','==',TOPIC).onSnapshot(function(snap){
      var next = {};
      snap.docs.forEach(function(d){ var v = d.data(); if (v) next[d.id] = {status: v.status, by: v.by, at: v.at}; });
      state = next;
      if (!snap.metadata.fromCache) { clearTimeout(timer); if (canWrite) setSync('Đồng bộ với cả nhóm'); }
      render(); resolveNames();
    }, function(){ clearTimeout(timer); setSync('Mất kết nối dữ liệu chung'); });
  }).catch(function(){ setSync('Lưu trên trình duyệt này'); });
})();
</script>
